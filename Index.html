<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đổi nhị phân sang IP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{--bg:#e9eeec;--panel:#f7faf9;--ink:#13292b;--mute:#5d7070;--line:#c3d0cd;--on:#13292b;--on-ink:#f7faf9;--acc:#d98e04;--err:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a1b;--panel:#152526;--ink:#e6f0ee;--mute:#8aa3a0;--line:#2a4143;--on:#e6f0ee;--on-ink:#0e1a1b;--acc:#f0b429;--err:#ff8a80}}
:root[data-theme="dark"]{--bg:#0e1a1b;--panel:#152526;--ink:#e6f0ee;--mute:#8aa3a0;--line:#2a4143;--on:#e6f0ee;--on-ink:#0e1a1b;--acc:#f0b429;--err:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:clamp(28px,7vw,40px);line-height:1.1;margin:0 0 6px;font-weight:700;letter-spacing:-.02em}
p.sub{margin:0 0 24px;color:var(--mute)}
label{display:block;font-weight:500;margin:18px 0 6px}
.field{display:flex;gap:8px}
input{flex:1;min-width:0;font:400 18px "JetBrains Mono",ui-monospace,Menlo,monospace;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:12px 14px}
input:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button{font:500 15px "Bricolage Grotesque",system-ui,sans-serif;background:var(--on);color:var(--on-ink);border:0;border-radius:6px;padding:0 16px;cursor:pointer;white-space:nowrap}
button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.status{min-height:22px;margin-top:8px;font-size:14px;color:var(--mute)}
.status.err{color:var(--err)}
.result{margin-top:22px;background:var(--on);color:var(--on-ink);border-radius:8px;padding:18px 18px 16px}
.result small{opacity:.7;font-size:14px}
.ip{font:700 clamp(28px,8.5vw,44px)/1.15 "JetBrains Mono",ui-monospace,monospace;word-break:break-all;margin:4px 0 12px}
.ip.empty{opacity:.35}
.octs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:22px}
.oct{background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:10px 6px;text-align:center;min-width:0}
.bits{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;font:400 13px "JetBrains Mono",ui-monospace,monospace}
.bits b{font-weight:700;padding:3px 0;border-radius:3px}
.bits b.on{background:var(--acc);color:#1a1200}
.bits i{font-style:normal;font-size:9px;color:var(--mute)}
.dec{font:700 22px "JetBrains Mono",ui-monospace,monospace;margin-top:8px}
.dec.pending{color:var(--mute);font-weight:400}
@media (max-width:480px){.octs{grid-template-columns:repeat(2,1fr)}.bits{font-size:15px}.bits i{font-size:10px}}
</style>
</head>
<body>
<main>
<h1>Đổi nhị phân sang IP</h1>
<p class="sub">Nhập 32 bit, trang tự đổi sang địa chỉ IPv4. Gõ IP ở ô dưới thì đổi ngược lại.</p>

<label for="bin">Chuỗi nhị phân (32 bit)</label>
<div class="field">
  <input id="bin" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="11000000101010000000000100000001">
  <button class="ghost" id="clr" type="button">Xóa</button>
</div>
<div class="status" id="st" role="status" aria-live="polite"></div>

<div class="result">
  <small>Địa chỉ IPv4</small>
  <div class="ip empty" id="ip">0.0.0.0</div>
  <button id="cp" type="button" disabled>Sao chép IP</button>
</div>

<div class="octs" id="octs"></div>

<label for="ipin">Hoặc nhập IP để đổi sang nhị phân</label>
<input id="ipin" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="192.168.1.1">
<div class="status" id="st2" role="status" aria-live="polite"></div>
</main>

<script>
const $=id=>document.getElementById(id);
const bin=$('bin'),ipin=$('ipin'),ipEl=$('ip'),st=$('st'),st2=$('st2'),octs=$('octs'),cp=$('cp');
const W=[128,64,32,16,8,4,2,1];
let currentIP='';

function render(bits){
  octs.innerHTML='';
  for(let o=0;o<4;o++){
    const chunk=bits.slice(o*8,o*8+8);
    const full=chunk.length===8;
    let cells='';
    for(let i=0;i<8;i++){
      const c=chunk[i];
      cells+=`<div><b class="${c==='1'?'on':''}">${c??'·'}</b><i>${W[i]}</i></div>`;
    }
    const dec=full?parseInt(chunk,2):'?';
    octs.insertAdjacentHTML('beforeend',`<div class="oct"><div class="bits">${cells}</div><div class="dec ${full?'':'pending'}">${dec}</div></div>`);
  }
}

function fromBinary(){
  const raw=bin.value;
  const bad=raw.replace(/[01\s.]/g,'');
  const bits=raw.replace(/[^01]/g,'');
  render(bits.slice(0,32));
  currentIP='';cp.disabled=true;
  st.className='status';
  if(bad){st.className='status err';st.textContent='Chỉ nhập số 0 và 1 (dấu cách và dấu chấm được bỏ qua).';}
  else if(bits.length===0){st.textContent='';}
  else if(bits.length<32){st.textContent=`Đã nhập ${bits.length}/32 bit, còn thiếu ${32-bits.length} bit.`;}
  else if(bits.length>32){st.className='status err';st.textContent=`Thừa ${bits.length-32} bit. Địa chỉ IPv4 chỉ có 32 bit.`;}
  else{
    currentIP=[0,8,16,24].map(i=>parseInt(bits.slice(i,i+8),2)).join('.');
    st.textContent='Đủ 32 bit.';cp.disabled=false;
    ipin.value=currentIP;st2.textContent='';
  }
  ipEl.textContent=currentIP||'0.0.0.0';
  ipEl.classList.toggle('empty',!currentIP);
}

function fromIP(){
  const v=ipin.value.trim();
  st2.className='status';
  if(!v){st2.textContent='';return;}
  const p=v.split('.');
  const ok=p.length===4&&p.every(x=>/^\d{1,3}$/.test(x)&&+x<=255);
  if(!ok){st2.className='status err';st2.textContent='IP chưa hợp lệ. Cần 4 số từ 0 đến 255, cách nhau bằng dấu chấm.';return;}
  const b=p.map(x=>(+x).toString(2).padStart(8,'0'));
  bin.value=b.join('');
  fromBinary();
  st2.textContent='Nhị phân có dấu chấm: '+b.join('.');
}

bin.addEventListener('input',fromBinary);
ipin.addEventListener('input',fromIP);
$('clr').addEventListener('click',()=>{bin.value='';ipin.value='';st2.textContent='';fromBinary();bin.focus();});
cp.addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText(currentIP);cp.textContent='Đã sao chép';}
  catch(e){cp.textContent='Không sao chép được';}
  setTimeout(()=>cp.textContent='Sao chép IP',1500);
});
fromBinary();
</script>
</body>
  </html>
